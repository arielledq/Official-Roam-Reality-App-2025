<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="800px" height="800px" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Gradient for red arrow -->
  <linearGradient id="redArrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:#EA4335;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#C5221F;stop-opacity:1" />
  </linearGradient>
  
  <!-- Shadow for arrow -->
  <filter id="arrowShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="0.8"/>
    <feOffset dx="0" dy="1" result="offsetblur"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.25"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Simple clean arrow pointing North -->
<g filter="url(#arrowShadow)">
  <!-- Main red arrow shape -->
  <path 
    d="M 24 8 L 20 24 L 24 22 L 28 24 Z" 
    fill="url(#redArrowGradient)" 
    stroke="none"
  />
  
  <!-- Gray/light tail -->
  <path 
    d="M 24 22 L 20 24 L 24 40 L 28 24 Z" 
    fill="#DADCE0" 
    stroke="none"
  />
</g>

<!-- Center dot -->
<circle cx="24" cy="24" r="2" fill="#5F6368" stroke="#fff" stroke-width="1"/>

</svg>
