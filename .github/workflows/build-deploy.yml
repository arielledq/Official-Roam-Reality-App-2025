name: az-build-deploy

on:
  push:
    branches:
      - develop # Staging environment 
      - main    # Production environment
      - master  # Production environment
env:
  AZURE_REGISTRY_LOGIN_SERVER: ${{ vars.CUSTOMER_AZURE_REGISTRY_NAME }}.azurecr.io
  IMAGE_NAME: ${{ vars.AZURE_APP_NAME }}

jobs:
  set_enviroment:
    runs-on: ubuntu-latest
    outputs:
      my_env: ${{ steps.set_env.outputs.my_env }}
      branch: ${{ steps.set_env.outputs.branch }}
    steps:
      - name: Set Env
        id: set_env
        run: |
          if [ "${{ github.ref_name }}" == "develop" ]; then
            echo "my_env=staging" >> $GITHUB_OUTPUT
            echo "branch=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "main" ]; then
            echo "my_env=production" >> $GITHUB_OUTPUT
            echo "branch=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "master" ]; then
            echo "my_env=production" >> $GITHUB_OUTPUT
            echo "branch=production" >> $GITHUB_OUTPUT
          fi
       
  build:
    needs: [set_enviroment]
    name: "${{ needs.set_enviroment.outputs.my_env }}: build & push docker image"
    environment: ${{ needs.set_enviroment.outputs.my_env }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for OIDC-based login to Azure

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.CUSTOMER_ACR_USERNAME }}
          password: ${{ secrets.CUSTOMER_ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          file: Dockerfile    
          build-args: |
            SECRET_KEY=build

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [build, set_enviroment]
    environment: ${{ needs.set_enviroment.outputs.my_env }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CUSTOMER_AZURE_CREDENTIALS }}

      - name: Set container on Azure Web App
        run: |
          az webapp config container set \
            --name ${{ vars.AZURE_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --container-image-name "${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --container-registry-url "https://${{ env.AZURE_REGISTRY_LOGIN_SERVER }}"

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --name ${{ vars.AZURE_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }}