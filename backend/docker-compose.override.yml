version: "3.9"

services:
  web:
    build:
      context: .
      args:
        SECRET_KEY: ${SECRET_KEY}
    env_file: .env
    volumes:
      - ./:/opt/webapp
    ports:
      - "8000:${PORT}"
  postgres:
    environment:
      POSTGRES_USER: roam_reality_user
      POSTGRES_PASSWORD: ropstam@786
      POSTGRES_DB: roam_realitydb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  redis:
    ports:
      - "6379:6379"

volumes: 
  postgres-data:

